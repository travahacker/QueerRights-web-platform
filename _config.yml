title: Queer Rights
description: Comunidade Queer Rights - Luta pelos direitos LGBTQIA+
baseurl: "/QueerRights-web-platform"
url: "https://travahacker.github.io"

# Configurações do GitHub Pages
github: [metadata]

# Desabilitar tema padrão do GitHub Pages
remote_theme: null

# Plugins opcionais (descomente se necessário)
# plugins:
#   - jekyll-feed
#   - jekyll-seo-tag

# Configurações de build
markdown: kramdown
highlighter: rouge
# Não usar tema padrão - usar layout customizado
theme: null
plugins: []

# Configurações de autor
author:
  name: Queer Rights Community

# Configurações de redes sociais
social:
  signal: "#" # Link do grupo Signal será configurado na página

# Configurações de email (opcional)
# email: contato@queerrights.org

# Configurações de localização
locale: pt-BR
timezone: America/Sao_Paulo

# Configurações de exibição
show_excerpts: false
paginate: 5
