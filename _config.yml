title: Queer Rights
description: Comunidade Queer Rights - Luta pelos direitos LGBTQIA+
baseurl: "/QueerRights-web-platform"
url: "https://travahacker.github.io"

# Configurações do GitHub Pages
github: [metadata]

# Desabilitar tema padrão do GitHub Pages completamente
remote_theme: null
theme: null

# Plugins - vazio para não usar plugins padrão
plugins: []

# Configurações de build
markdown: kramdown
highlighter: rouge

# Forçar uso de layouts locais
layouts_dir: _layouts
includes_dir: _includes
data_dir: _data

# Configurações de autor
author:
  name: Queer Rights Community

# Configurações de redes sociais
social:
  signal: "#" # Link do grupo Signal será configurado na página

# Configurações de email (opcional)
# email: contato@queerrights.org

# Configurações de localização
locale: pt-BR
timezone: America/Sao_Paulo

# Configurações de exibição
show_excerpts: false
paginate: 5

# Excluir README.md do build para evitar conflito com index.html
exclude: ["README.md"]
